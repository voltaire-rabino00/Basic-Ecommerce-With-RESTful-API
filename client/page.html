<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew Bliss Coffee</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">Brew Bliss</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="./index.html">Products</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- HERO + SLIDESHOW -->
<section class="hero">
    <h2 class="hero-title">Our Featured Products</h2>

    <div class="slideshow-container" id="slideshow"></div>

    <button class="explore-btn">Explore Now</button>
</section>




    <!-- CONTACT PLACEHOLDER -->
    <section id="contact" class="contact-section">
        <h2>Contact Us</h2>

        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <input type="text" id="name" placeholder="Your Name" required>
            </div>

            <div class="form-group">
                <input type="email" id="email" placeholder="Your Email" required>
            </div>

            <div class="form-group">
                <textarea id="message" placeholder="Your Message" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>

            <p id="responseMessage" class="response-msg"></p>
        </form>
    </section>


    <!-- Team Section -->

    <section id="contact" class="team-section">
        <h2 class="team-title">Meet the Brew Bliss Team</h2>
        <div id="teamContainer" class="team-container"></div>
    </section>

    <script>

    </script>


    <script src="app.js"></script>
</body>

</html>
