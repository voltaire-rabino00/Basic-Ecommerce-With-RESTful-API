<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew Bliss Coffee</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="main-header">
    <h1>Brew Bliss Coffee</h1>
    <p>Premium & Freshly Roasted Coffee Beans</p>
    <nav>
        <div class="cart-btn">
            🛒 <span id="cartCount">0</span>
        </div>
    </nav>
</header>

</header>

<section class="products-section">
    <h2>Our Products</h2>
    <div id="product-list" class="product-list"></div>
</section>



<!-- CART MODAL -->
<div id="cartModal" class="modal">
  <div class="modal-content">
    <span id="closeCart" class="close">&times;</span>
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
  </div>
</div>

<!-- BUY NOW MODAL -->
<div id="buyModal" class="modal">
  <div class="modal-content">
    <span id="closeBuy" class="close">&times;</span>

    <h2 id="buyTitle"></h2>
    <img id="buyImage" src="" width="160" style="border-radius:10px; margin:10px 0;">
    <p id="buyDescription"></p>
    <p style="font-size:1.2rem;"><b>₱<span id="buyPrice"></span></b></p>

    <button id="confirmBuy" class="btn-primary">Confirm Purchase</button>
  </div>
</div>


<script src="app.js"></script>
</body>
</html>
